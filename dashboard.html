<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseSafe Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-red: #ff3366;
            --accent-red-glow: rgba(255, 51, 102, 0.4);
            --accent-green: #00ffcc;
            --accent-green-glow: rgba(0, 255, 204, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Blobs for Glass Effect */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            animation: float 20s infinite alternate;
        }
        .blob-1 {
            width: 500px;
            height: 500px;
            background: rgba(255, 51, 102, 0.15);
            top: -100px;
            left: -100px;
        }
        .blob-2 {
            width: 600px;
            height: 600px;
            background: rgba(0, 102, 255, 0.1);
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Glassmorphism Utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            background: linear-gradient(90deg, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Telemetry Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-title {
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green-glow);
        }

        .status-dot.offline {
            background-color: #555;
            box-shadow: none;
        }

        /* Alerts Feed */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--glass-border);
        }

        .feed-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        #alerts-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .alert-card {
            padding: 30px;
            border-left: 4px solid var(--accent-red);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .alert-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        /* Pulse effect for brand new alerts */
        @keyframes pulse-border {
            0% { box-shadow: inset 0 0 0 0 var(--accent-red-glow); }
            50% { box-shadow: inset 0 0 20px 2px var(--accent-red-glow); }
            100% { box-shadow: inset 0 0 0 0 var(--accent-red-glow); }
        }
        .alert-card.new {
            animation: pulse-border 2s ease-out 3;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .alert-title {
            color: var(--accent-red);
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-title::before {
            content: '⚠️';
            font-size: 1.2rem;
        }

        .alert-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .location-link {
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .location-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .media-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .media-grid.has-video {
                grid-template-columns: 1fr 1fr;
            }
        }

        .map-container, .video-container {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            border: 1px solid var(--glass-border);
        }

        iframe, video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }

        video {
            outline: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="container">
        <header>
            <h1>Pulse Safe</h1>
            <p>Live Emergency Telemetry & Command Center</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card glass">
                <span class="stat-title">System Status</span>
                <div class="status-indicator">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text" style="color: var(--accent-green);">ONLINE</span>
                </div>
            </div>
            <div class="stat-card glass">
                <span class="stat-title">Total Detections</span>
                <span class="stat-value" id="alert-count">0</span>
            </div>
            <div class="stat-card glass">
                <span class="stat-title">Last Event Time</span>
                <span class="stat-value" id="last-alert-time" style="font-size: 1.2rem; margin-top: auto;">--:--:--</span>
            </div>
        </div>

        <div class="feed-header">
            <h2>Live Feed</h2>
        </div>
        
        <div id="alerts-container">
            <div class="empty-state glass">Waiting for incoming telemetry...</div>
        </div>
    </div>

    <script>
        const socket = io();
        const alertsContainer = document.getElementById('alerts-container');
        const alertCountEl = document.getElementById('alert-count');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const lastAlertTimeEl = document.getElementById('last-alert-time');

        let alertCounter = 0;

        function updateAlertCount(count) {
            alertCounter = count;
            alertCountEl.textContent = alertCounter.toString().padStart(2, '0');
        }

        function updateLastAlertTime(timestamp) {
            const date = new Date(timestamp);
            lastAlertTimeEl.textContent = date.toLocaleTimeString([], { hour12: false });
        }

        function createAlertCard(alert, isNew = false) {
            // Remove empty state if it exists
            const emptyState = document.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const alertCard = document.createElement('div');
            alertCard.className = `alert-card glass ${isNew ? 'new' : ''}`;
            
            const hasVideo = !!alert.videoUrl;
            
            let cardHtml = `
                <div class="alert-header">
                    <div class="alert-title">CRITICAL EVENT DETECTED</div>
                    <div class="alert-meta">${alert.formattedTimestamp}</div>
                </div>
                
                <a href="${alert.osmUrl}" target="_blank" class="location-link">
                    📍 Lat: ${parseFloat(alert.latitude).toFixed(4)}, Lng: ${parseFloat(alert.longitude).toFixed(4)} ↗
                </a>

                <div class="media-grid ${hasVideo ? 'has-video' : ''}">
                    <div class="map-container">
                        <iframe
                            loading="lazy"
                            allowfullscreen
                            referrerpolicy="no-referrer-when-downgrade"
                            src="http://www.openstreetmap.org/export/embed.html?bbox=${alert.longitude},${alert.latitude},${alert.longitude},${alert.latitude}&layer=mapnik&marker=${alert.latitude},${alert.longitude}">
                        </iframe>
                    </div>
            `;
            
            if (hasVideo) {
                cardHtml += `
       -             <div class="video-container">
                        <video controls>
                            <source src="${alert.videoUrl}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                `;
            }

            cardHtml += `</div>`; // Close media-grid

            alertCard.innerHTML = cardHtml;
            alertsContainer.prepend(alertCard);
            
            updateLastAlertTime(alert.timestamp);
        }

        // Socket Events
        socket.on('initial-alerts', (alerts) => {
            alertsContainer.innerHTML = ''; // Clear container
            if (alerts.length === 0) {
                alertsContainer.innerHTML = '<div class="empty-state glass">Waiting for incoming telemetry...</div>';
            } else {
                alerts.slice().reverse().forEach(alert => {
                    createAlertCard(alert, false);
                });
                updateAlertCount(alerts.length);
            }
        });

        socket.on('new-alert', (alert) => {
            createAlertCard(alert, true);
            updateAlertCount(alertCounter + 1);
        });
        
        socket.on('connect', () => {
            statusDot.classList.remove('offline');
            statusText.textContent = 'ONLINE';
            statusText.style.color = 'var(--accent-green)';
        });

        socket.on('disconnect', () => {
            statusDot.classList.add('offline');
            statusText.textContent = 'OFFLINE';
            statusText.style.color = '#555';
        });
    </script>
</body>
</html>
